[project]
name = "elith"
version = "0.1.0"
description = "Universal repo-aware agent framework"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "sse-starlette>=1.8.0",
    "python-dotenv>=1.0.0",
    "textual>=0.47.0",
    "pyfiglet>=1.0.2",
    "rich>=13.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.26.0",
    "psutil>=5.9.6",
]

[project.scripts]
elith = "cli:main"

[tool.setuptools]
packages = ["backend", "backend.context_engine", "backend.models", "backend.providers", "backend.routes", "backend.router", "backend.session", "backend.skills", "backend.utils", "tui", "tui.screens"]
py-modules = ["cli"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
