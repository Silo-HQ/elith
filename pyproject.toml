[project]
name = "elith"
version = "0.1.0"
description = "Universal repo-aware agent framework"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "sse-starlette>=1.8.0",
    "python-dotenv>=1.0.0",
    "textual>=0.47.0",
    "pyfiglet>=1.0.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"